
</script>
<script>
// ─────────────────────────────────────────────
// LOGIN E CONTROLE DE ACESSO — Supabase Auth
// ─────────────────────────────────────────────
let BK_jaLogou=false, BK_semPerfil=false;
function BK_authApply(session){
  const u=session&&session.user?session.user:null;
  BK_AUTH.user=u;
  BK_AUTH.nivel=u&&u.app_metadata?u.app_metadata.nivel||null:null;
  BK_AUTH.extras=u&&u.app_metadata&&Array.isArray(u.app_metadata.extras)?u.app_metadata.extras:[];
  BK_AUTH.modulos=u&&u.app_metadata&&Array.isArray(u.app_metadata.modulos)?u.app_metadata.modulos:null;
  const perfil=BK_perfil();
  if(u&&!perfil){
    BK_semPerfil=true;
    getSupabaseClient().auth.signOut();
    const e=document.getElementById('bkLoginErr'); if(e)e.textContent='Seu usuário ainda não tem um perfil de acesso. Fale com o administrador.';
    return;
  }
  const trocar=!!(u&&u.user_metadata&&u.user_metadata.trocar_senha===true);
  document.body.classList.toggle('bk-locked',!u);
  document.body.classList.toggle('bk-trocar',!!u&&trocar);
  document.body.classList.toggle('bk-nodel',!!perfil&&!perfil.excluir);
  document.body.classList.toggle('bk-ro',!!perfil&&perfil.editar===false);
  const mail=document.getElementById('bkUserMail'), niv=document.getElementById('bkUserNivel');
  if(mail)mail.textContent=u?u.email:''; if(niv)niv.textContent=perfil?perfil.rotulo:'';
  if(!u)return;
  BK_jaLogou=true;
  const navs=[...document.querySelectorAll('.sidebar-nav .nav-item')];
  navs.forEach(b=>{ b.style.display=BK_podeVer(b.dataset.page)?'':'none'; });
  const ativo=document.querySelector('.sidebar-nav .nav-item.active');
  if(!ativo||ativo.style.display==='none'){
    const primeiro=navs.find(b=>b.style.display!=='none');
    if(primeiro)primeiro.click();
  }
}
async function BK_authInit(){
  const form=document.getElementById('bkLoginForm'), errEl=document.getElementById('bkLoginErr'), btn=document.getElementById('bkLoginBtn');
  let auth;
  try{ auth=getSupabaseClient().auth; }catch(e){ errEl.textContent='Não foi possível carregar o login. Verifique a conexão.'; return; }
  form.addEventListener('submit',async ev=>{
    ev.preventDefault(); errEl.textContent=''; btn.disabled=true; btn.textContent='Entrando…';
    const {error}=await auth.signInWithPassword({email:document.getElementById('bkLoginEmail').value.trim(),password:document.getElementById('bkLoginSenha').value});
    btn.disabled=false; btn.textContent='Entrar';
    if(error){errEl.textContent='E-mail ou senha incorretos.';return;}
    document.getElementById('bkLoginSenha').value='';
  });
  document.getElementById('bkLogout').addEventListener('click',()=>auth.signOut());
  document.getElementById('bkTrocaForm').addEventListener('submit',async ev=>{
    ev.preventDefault(); const err=document.getElementById('bkTrocaErr'), nova=document.getElementById('bkTrocaNova').value, conf=document.getElementById('bkTrocaConf').value; err.textContent='';
    if(nova.length<8){err.textContent='A senha precisa ter ao menos 8 caracteres.';return;}
    if(nova!==conf){err.textContent='As senhas não conferem.';return;}
    const {data,error}=await auth.updateUser({password:nova,data:{trocar_senha:false}});
    if(error){err.textContent='Não foi possível salvar a senha. Tente uma senha diferente.';return;}
    document.getElementById('bkTrocaNova').value=''; document.getElementById('bkTrocaConf').value=''; BK_authApply({user:data.user});
  });
  auth.onAuthStateChange((evento,session)=>{ if(evento==='SIGNED_OUT'&&BK_jaLogou&&!BK_semPerfil){location.reload();return;} BK_authApply(session); });
  const {data}=await auth.getSession(); BK_authApply(data&&data.session);
}

// Administração de usuários via Edge Function protegida no servidor.
function ADM_esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function ADM_call(body){
  const {data,error}=await getSupabaseClient().functions.invoke('admin-usuarios',{body});
  if(error){let msg='Falha ao falar com o servidor.';try{const j=await error.context.json();if(j&&j.error)msg=j.error;}catch(_e){}throw new Error(msg);}
  if(data&&data.error)throw new Error(data.error); return data;
}
function ADM_msg(texto,tipo){const el=document.getElementById('admMsg');if(!el)return;el.textContent=texto||'';el.className='adm-msg'+(tipo?' '+tipo:'');}
function ADM_opcoesPerfil(sel){return Object.keys(BK_PERFIS).map(k=>`<option value="${k}"${k===sel?' selected':''}>${ADM_esc(BK_PERFIS[k].rotulo)}</option>`).join('');}
function ADM_modulosHtml(selected, name){
  const set=new Set(Array.isArray(selected)?selected:[]);
  return BK_MODULOS.map(([id,label])=>`<label><input type="checkbox" name="${name}" value="${id}"${set.has(id)?' checked':''}> ${ADM_esc(label)}</label>`).join('');
}
function ADM_modulosSelecionados(containerId){return [...document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`)].map(x=>x.value);}
function ADM_modulosDoPerfil(k){const p=BK_PERFIS[k];return p&&p.modulos==='*'?'*':(p&&Array.isArray(p.modulos)?p.modulos:[]);}
function ADM_hint(){const k=document.getElementById('admPerfil')?.value,p=BK_PERFIS[k],el=document.getElementById('admHint'),box=document.getElementById('admModulos');if(el)el.textContent=(p?p.resumo:'')+' A seleção abaixo prevalece para este usuário.';if(box&&!box.dataset.ready){box.innerHTML=ADM_modulosHtml(ADM_modulosDoPerfil(k),'admModulo');box.dataset.ready='1';}}
function ADM_fmtData(iso){if(!iso)return 'Nunca acessou';const d=new Date(iso);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
let ADM_users=[];
function ADM_render(){
  const tb=document.getElementById('admTbody'); if(!tb)return;
  if(!ADM_users.length){tb.innerHTML='<tr><td colspan="6">Nenhum usuário cadastrado.</td></tr>';return;}
  const meuId=BK_AUTH.user&&BK_AUTH.user.id;
  tb.innerHTML=ADM_users.map(u=>{const eu=u.id===meuId;const mods=u.modulos==='*'?'Todos':(Array.isArray(u.modulos)?u.modulos.length+' selecionado(s)':'Perfil padrão');return `<tr data-id="${ADM_esc(u.id)}"><td><div class="adm-user-nome">${ADM_esc(u.nome||u.email)}${eu?' (você)':''}</div>${u.nome?`<div class="adm-user-mail">${ADM_esc(u.email)}</div>`:''}</td><td><select class="adm-perfil-sel" data-acao="perfil"${eu?' disabled':''}>${ADM_opcoesPerfil(u.nivel)}</select></td><td><span class="adm-user-mail">${ADM_esc(mods)}</span><br><button type="button" class="adm-row-btn" data-acao="modulos"${eu?' disabled':''}>Editar módulos</button></td><td><span class="adm-pill ${u.ativo?'on':'off'}">${u.ativo?'Ativo':'Desativado'}</span>${u.trocar_senha?'<br><span class="adm-pill pend">Senha provisória</span>':''}</td><td>${ADM_esc(ADM_fmtData(u.ultimo_acesso))}</td><td><button type="button" class="adm-row-btn" data-acao="reset">Redefinir senha</button><button type="button" class="adm-row-btn" data-acao="ativo"${eu?' disabled':''}>${u.ativo?'Desativar':'Ativar'}</button></td></tr>`;}).join('');
}
async function ADM_load(){
  const sel=document.getElementById('admPerfil'); if(!sel)return;
  if(!sel.options.length){sel.innerHTML=ADM_opcoesPerfil('estoque');ADM_hint();}
  try{ADM_users=(await ADM_call({action:'list'})).users||[];ADM_render();}catch(e){document.getElementById('admTbody').innerHTML=`<tr><td colspan="6">${ADM_esc(e.message)}</td></tr>`;}
}
let ADM_resetId=null;
document.addEventListener('DOMContentLoaded',()=>{
  BK_authInit();
  const form=document.getElementById('admForm'); if(!form)return;
  document.getElementById('admPerfil').addEventListener('change',()=>{const box=document.getElementById('admModulos');if(box){box.innerHTML=ADM_modulosHtml(ADM_modulosDoPerfil(document.getElementById('admPerfil').value),'admModulo');box.dataset.ready='1';}ADM_hint();});
  form.addEventListener('submit',async ev=>{
    ev.preventDefault();const btn=document.getElementById('admBtn');btn.disabled=true;ADM_msg('Cadastrando…');
    try{const r=await ADM_call({action:'create',nome:document.getElementById('admNome').value,email:document.getElementById('admEmail').value,password:document.getElementById('admSenha').value,nivel:document.getElementById('admPerfil').value,modulos:ADM_modulosSelecionados('admModulos')});ADM_msg('Usuário '+r.user.email+' cadastrado. Ele definirá a senha pessoal no primeiro acesso.','ok');form.reset();const box=document.getElementById('admModulos');box.innerHTML=ADM_modulosHtml(ADM_modulosDoPerfil('estoque'),'admModulo');ADM_hint();await ADM_load();}catch(e){ADM_msg(e.message,'err');}btn.disabled=false;
  });
  const tb=document.getElementById('admTbody');
  tb.addEventListener('change',async ev=>{const sel=ev.target.closest('select[data-acao="perfil"]');if(!sel)return;try{await ADM_call({action:'update',id:sel.closest('tr').dataset.id,nivel:sel.value});ADM_msg('Perfil atualizado. Vale no próximo acesso.','ok');}catch(e){ADM_msg(e.message,'err');}await ADM_load();});
  tb.addEventListener('click',async ev=>{const btn=ev.target.closest('button[data-acao]');if(!btn)return;const id=btn.closest('tr').dataset.id,u=ADM_users.find(x=>x.id===id);if(btn.dataset.acao==='modulos'){document.getElementById('admModulosQuem').textContent=u.email;document.getElementById('admModulosEdit').innerHTML=ADM_modulosHtml(u.modulos==='*'?BK_MODULOS.map(x=>x[0]):(Array.isArray(u.modulos)?u.modulos:ADM_modulosDoPerfil(u.nivel)),'admModuloEdit');document.getElementById('admModulosErr').textContent='';document.getElementById('admModulosModal').style.display='flex';}else if(btn.dataset.acao==='reset'){ADM_resetId=id;document.getElementById('admResetQuem').textContent=u.email;document.getElementById('admResetSenha').value='';document.getElementById('admResetErr').textContent='';document.getElementById('admResetModal').style.display='flex';}else if(btn.dataset.acao==='ativo'){if(u.ativo&&!confirm('Desativar o acesso de '+u.email+'?'))return;try{await ADM_call({action:'update',id,ativo:!u.ativo});ADM_msg(u.ativo?'Usuário desativado.':'Usuário reativado.','ok');}catch(e){ADM_msg(e.message,'err');}await ADM_load();}});
  document.getElementById('admResetCancel').addEventListener('click',()=>document.getElementById('admResetModal').style.display='none');
  document.getElementById('admModulosCancel').addEventListener('click',()=>document.getElementById('admModulosModal').style.display='none');
  document.getElementById('admModulosForm').addEventListener('submit',async ev=>{ev.preventDefault();const err=document.getElementById('admModulosErr');err.textContent='';try{const alvo=ADM_users.find(u=>u.email===document.getElementById('admModulosQuem').textContent);if(!alvo)throw new Error('Usuário não encontrado.');await ADM_call({action:'update',id:alvo.id,modulos:ADM_modulosSelecionados('admModulosEdit')});document.getElementById('admModulosModal').style.display='none';ADM_msg('Módulos atualizados. Valerá no próximo acesso.','ok');await ADM_load();}catch(e){err.textContent=e.message;}});
  document.getElementById('admResetForm').addEventListener('submit',async ev=>{ev.preventDefault();try{await ADM_call({action:'reset',id:ADM_resetId,password:document.getElementById('admResetSenha').value});document.getElementById('admResetModal').style.display='none';ADM_msg('Senha redefinida.','ok');await ADM_load();}catch(e){document.getElementById('admResetErr').textContent=e.message;}});
});
</script>
</body>
